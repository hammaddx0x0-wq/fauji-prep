<title>Fauji Prep — PMA &amp; ISSB Test Simulator</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #171d12;
    --bg-panel: #212a18;
    --bg-panel-2: #262f1c;
    --line: #3a4429;
    --khaki: #c7b483;
    --khaki-dim: #8d8460;
    --olive: #5c6b3f;
    --olive-bright: #7c9153;
    --rust: #a8482f;
    --rust-bright: #c65a3c;
    --text: #eee7d3;
    --text-dim: #a9a58c;
    --ok: #6f8f4e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(124,145,83,0.08), transparent 40%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 14px);
    color: var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Oswald', sans-serif;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color: var(--khaki);
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  .app{max-width:1000px;margin:0 auto;padding:18px 16px 60px;}

  /* ---------- Top bar / rank ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:2px solid var(--olive);
    padding-bottom:14px;margin-bottom:20px;flex-wrap:wrap;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .badge{
    width:42px;height:42px;border:2px solid var(--khaki);
    display:flex;align-items:center;justify-content:center;
    transform:rotate(45deg);flex-shrink:0;
  }
  .brand .badge span{transform:rotate(-45deg);font-family:'Oswald';font-weight:700;color:var(--khaki);font-size:15px;}
  .brand h1{font-size:22px;line-height:1;}
  .brand small{display:block;color:var(--text-dim);text-transform:none;letter-spacing:normal;font-family:'IBM Plex Sans';font-size:12px;}

  .rank-box{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--line);background:var(--bg-panel);
    padding:8px 14px;
  }
  .rank-stars{display:flex;gap:3px;}
  .star{width:10px;height:10px;background:var(--khaki-dim);clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);}
  .star.filled{background:var(--khaki);}
  .rank-label{font-family:'Oswald';font-size:13px;letter-spacing:0.05em;text-transform:uppercase;color:var(--khaki);}
  .rank-sub{font-size:11px;color:var(--text-dim);}

  /* ---------- Nav ---------- */
  .nav{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;}
  .nav button{
    background:var(--bg-panel);color:var(--text);border:1px solid var(--line);
    font-family:'Oswald';letter-spacing:0.04em;text-transform:uppercase;font-size:13px;
    padding:10px 16px;cursor:pointer;transition:.15s;
  }
  .nav button:hover{border-color:var(--olive-bright);}
  .nav button.active{background:var(--olive);border-color:var(--olive-bright);color:#fff;}

  .panel{background:var(--bg-panel);border:1px solid var(--line);padding:20px;margin-bottom:16px;}
  .panel + .panel{margin-top:16px;}

  /* home cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
  .card{
    background:var(--bg-panel);border:1px solid var(--line);padding:18px;
    cursor:pointer;transition:.15s;position:relative;overflow:hidden;
  }
  .card:hover{border-color:var(--rust-bright);transform:translateY(-2px);}
  .card .tag{font-family:'IBM Plex Mono';font-size:11px;color:var(--rust-bright);letter-spacing:.08em;}
  .card h3{font-size:19px;margin:6px 0 8px;}
  .card p{color:var(--text-dim);font-size:13px;line-height:1.5;margin:0;}

  /* buttons */
  .btn{
    font-family:'Oswald';letter-spacing:0.04em;text-transform:uppercase;font-size:13px;
    background:var(--olive);color:#fff;border:1px solid var(--olive-bright);
    padding:10px 18px;cursor:pointer;transition:.15s;
  }
  .btn:hover{background:var(--olive-bright);}
  .btn.rust{background:var(--rust);border-color:var(--rust-bright);}
  .btn.rust:hover{background:var(--rust-bright);}
  .btn.ghost{background:transparent;color:var(--khaki);border:1px solid var(--khaki-dim);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  select,input[type=number],input[type=text],textarea{
    background:var(--bg);color:var(--text);border:1px solid var(--line);
    font-family:'IBM Plex Sans';padding:8px 10px;font-size:14px;
  }
  textarea{width:100%;min-height:110px;resize:vertical;font-family:'IBM Plex Sans';}
  label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;}

  /* quiz */
  .qhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .timer{font-family:'IBM Plex Mono';font-size:22px;color:var(--rust-bright);border:1px solid var(--rust);padding:4px 12px;}
  .timer.low{animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .progress-bar{height:5px;background:var(--line);margin-bottom:18px;position:relative;}
  .progress-bar > div{height:100%;background:var(--olive-bright);transition:width .2s;}
  .qcount{font-family:'IBM Plex Mono';color:var(--text-dim);font-size:12px;}
  .qsection-tag{display:inline-block;font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--bg);background:var(--khaki);padding:2px 8px;margin-bottom:10px;}
  .qtext{font-size:18px;line-height:1.5;margin-bottom:16px;color:var(--text);}
  .opt{
    display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);
    color:var(--text);padding:11px 14px;margin-bottom:9px;cursor:pointer;font-size:14px;transition:.12s;
  }
  .opt:hover{border-color:var(--olive-bright);}
  .opt.selected{border-color:var(--khaki);background:#2b3520;}
  .opt.correct{border-color:var(--ok);background:#26361f;}
  .opt.wrong{border-color:var(--rust);background:#382019;}
  .navrow{display:flex;justify-content:space-between;margin-top:16px;}
  .navgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .navgrid span{
    width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono';font-size:11px;border:1px solid var(--line);cursor:pointer;color:var(--text-dim);
  }
  .navgrid span.answered{border-color:var(--olive-bright);color:var(--khaki);}
  .navgrid span.current{border-color:var(--rust-bright);color:var(--rust-bright);}

  /* results */
  .score-big{font-family:'Oswald';font-size:56px;color:var(--khaki);line-height:1;}
  .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0;}
  .breakdown div{background:var(--bg);border:1px solid var(--line);padding:10px 12px;}
  .breakdown div b{display:block;font-family:'Oswald';font-size:20px;color:var(--khaki);}
  .review-item{border-left:3px solid var(--line);padding:10px 14px;margin-bottom:10px;background:var(--bg);}
  .review-item.wrong{border-left-color:var(--rust);}
  .review-item.right{border-left-color:var(--ok);}

  /* study notes */
  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .filterbar button{
    font-family:'IBM Plex Mono';font-size:12px;background:var(--bg);border:1px solid var(--line);
    color:var(--text-dim);padding:6px 12px;cursor:pointer;
  }
  .filterbar button.active{border-color:var(--khaki);color:var(--khaki);}
  .note-item{border:1px solid var(--line);padding:12px 14px;margin-bottom:8px;background:var(--bg);}
  .note-item .q{color:var(--text);margin-bottom:6px;}
  .note-item .a{color:var(--ok);font-size:13px;}
  .searchbox{width:100%;margin-bottom:14px;}

  /* ISSB sub-nav */
  .subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .subnav button{
    background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text-dim);
    font-family:'Oswald';text-transform:uppercase;font-size:12px;letter-spacing:.04em;padding:7px 13px;cursor:pointer;
  }
  .subnav button.active{border-color:var(--rust-bright);color:var(--rust-bright);}

  .srt-box{font-size:19px;line-height:1.55;margin-bottom:16px;border-left:3px solid var(--khaki);padding-left:16px;}
  .wat-word{
    font-family:'Oswald';font-size:52px;color:var(--khaki);text-align:center;
    padding:30px 0;border:1px dashed var(--olive);margin-bottom:16px;
  }
  .qa-block{border:1px solid var(--line);padding:12px 14px;margin-bottom:10px;background:var(--bg);}
  .qa-block .who{font-family:'IBM Plex Mono';font-size:11px;color:var(--rust-bright);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
  .qa-block .q{color:var(--text);}
  .info-card{border:1px solid var(--line);background:var(--bg);padding:14px 16px;margin-bottom:10px;}
  .info-card h4{font-family:'Oswald';color:var(--khaki);font-size:15px;text-transform:uppercase;margin:0 0 6px;letter-spacing:.03em;}
  .info-card p{margin:0;color:var(--text-dim);font-size:13.5px;line-height:1.6;}
  .footer-note{color:var(--text-dim);font-size:12px;text-align:center;margin-top:30px;line-height:1.6;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--olive);}
</style>

/* =========================================================================
   AUTO MCQ GENERATOR — reads pasted notes text and builds fill-in-the-blank
   MCQs automatically, entirely offline (no AI, just pattern rules: picks
   numbers, proper-noun terms, or key content words as the blank, and pulls
   distractors from elsewhere in the same notes).
   ========================================================================= */
const STOPWORDS = new Set(['the','and','that','with','from','this','have','has','are','was','were','will','shall','their','which','there','these','those','into','onto','also','such','than','then','when','where','while','been','being','over','under','after','before','about','because','they','them','some','more','most','each','every','only','other','another','both','many','much','very','just','can','could','would','should','not','but','for','you','your','our','his','her','its'].map(w=>w));

function generateMcqsFromNotes(text, maxQuestions){
  maxQuestions = maxQuestions || 30;
  // Split into candidate sentences.
  const rawSentences = text.split(/(?<=[.?!])\s+|\n+/).map(s=>s.trim()).filter(s=>s.length>0);
  const sentences = rawSentences.filter(s=>{
    const wc = s.split(/\s+/).length;
    return wc>=6 && wc<=42;
  });
  if(sentences.length===0) return [];

  // Global pools of candidate answer terms found across all notes.
  const numberPool = Array.from(new Set((text.match(/\b\d{1,4}(\.\d+)?\b/g)||[])));
  const properPool = Array.from(new Set((text.match(/\b[A-Z][a-zA-Z]{2,}(?:\s[A-Z][a-zA-Z]{2,}){0,2}\b/g)||[])
    .filter(w=>!STOPWORDS.has(w.toLowerCase()))));
  const wordPool = Array.from(new Set((text.match(/\b[a-zA-Z]{6,}\b/g)||[])
    .filter(w=>!STOPWORDS.has(w.toLowerCase()))));

  const used = new Set();
  const results = [];

  for(const sentence of sentences){
    if(results.length>=maxQuestions) break;
    let target=null, type=null;
    const numMatch = sentence.match(/\b\d{1,4}(\.\d+)?\b/);
    const properMatches = sentence.match(/\b[A-Z][a-zA-Z]{2,}(?:\s[A-Z][a-zA-Z]{2,}){0,2}\b/g);
    const properCandidate = properMatches ? properMatches.find((w,i)=> !(sentence.indexOf(w)===0) && !STOPWORDS.has(w.toLowerCase())) : null;
    if(numMatch){ target=numMatch[0]; type='number'; }
    else if(properCandidate){ target=properCandidate; type='proper'; }
    else {
      const words = sentence.match(/\b[a-zA-Z]{6,}\b/g)||[];
      const wordCandidate = words.find(w=>!STOPWORDS.has(w.toLowerCase()));
      if(wordCandidate){ target=wordCandidate; type='word'; }
    }
    if(!target) continue;
    const dedupeKey = sentence+'|'+target;
    if(used.has(dedupeKey)) continue;
    used.add(dedupeKey);

    // Build distractor pool matching type first, falling back to other pools.
    let pool = type==='number' ? numberPool.slice() : type==='proper' ? properPool.slice() : wordPool.slice();
    pool = pool.filter(w=>w.toLowerCase()!==target.toLowerCase());
    // top up with other pools if not enough distinct distractors
    if(pool.length<3){ pool = pool.concat(properPool, wordPool, numberPool).filter(w=>w.toLowerCase()!==target.toLowerCase()); }
    pool = Array.from(new Set(pool));
    shuffle(pool);
    let distractors = pool.slice(0,3);
    // if still short (very small notes), pad with tweaked numbers or generic filler
    while(distractors.length<3){
      if(type==='number'){ distractors.push(String(parseInt(target,10)+ (distractors.length+1)*2)); }
      else { distractors.push(target+' (other)'); }
    }
    const blanked = sentence.replace(target, '_____');
    const opts = shuffle([target, ...distractors]);
    const ans = opts.indexOf(target);
    results.push({q:'Fill in the blank: '+blanked, opts, ans});
    if(results.length>=maxQuestions) break;
  }
  return results;
}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function buildTest(total,minutes){
  const ratioV=0.28, ratioN=0.2; // rest academic
  let nV=Math.round(total*ratioV), nN=Math.round(total*ratioN);
  let nA=total-nV-nN;
  nV=Math.min(nV,BANK.verbal.length);
  nN=Math.min(nN,BANK.nonverbal.length);
  nA=Math.min(nA,BANK.academic.length);
  // Each section is its own shuffled block (Verbal block -> Non-Verbal block -> Academic block),
  // matching the real PMA initial test format instead of interleaving everything.
  let vBlock = shuffle(BANK.verbal).slice(0,nV).map(prepQuestion);
  let nBlock = shuffle(BANK.nonverbal).slice(0,nN).map(prepQuestion);
  let aBlock = shuffle(BANK.academic).slice(0,nA).map(prepQuestion);
  let picked=[...vBlock, ...nBlock, ...aBlock];
  // top up if short (append to academic tail, keeping verbal/non-verbal blocks intact)
  while(picked.length<total){
    const rest = shuffle(ALL_Q).find(q=>!picked.some(p=>p.id===q.id));
    if(!rest) break;
    picked.push(prepQuestion(rest));
  }
  return {
    questions: picked,
    answers: new Array(picked.length).fill(null),
    current: 0,
    secondsLeft: minutes*60,
    startedAt: Date.now(),
    finished:false
  };
}

// Builds a fresh question object with shuffled options and the correct _newAns
// baked in BEFORE the object is used anywhere, so it's never lost (fixes the
// "undefined" correct-answer bug).
function prepQuestion(q){
  const correctText = q.opts[q.ans];
  const shuffledOpts = shuffle(q.opts);
  const newAns = shuffledOpts.indexOf(correctText);
  return {...q, opts: shuffledOpts, _newAns: newAns};
}

function renderTestRun(){

  const low = t.secondsLeft<=60;
  const navgrid = t.questions.map((qq,i)=>{

function tickTimer(){
  if(!STATE.test || STATE.test.finished) return;
  STATE.test.secondsLeft--;
  if(STATE.test.secondsLeft<=0){
    STATE.test.secondsLeft=0;
    finishTest();
    return;
  }
  // light update: just re-render timer text without full rerender for perf
  render();
}
let TEST_TIMER_HANDLE=null;

function finishTest(){
  STATE.test.finished=true;
  const t=STATE.test;
  let correct=0;
  t.questions.forEach((q,i)=>{ if(t.answers[i]===q._newAns) correct++; });
  const pct = Math.round((correct/t.questions.length)*100);
  SAVE.attempts.push({date:new Date().toISOString(),score:pct,total:t.questions.length,correct});
  if(pct>SAVE.best) SAVE.best=pct;
  saveSave(SAVE);
  clearInterval(TEST_TIMER_HANDLE);
  setView('testresult');
}

// Deterministic tiny PRNG so the same seed always draws the same scene (no network call).
function seededRand(seed){
  let h=0; for(let i=0;i<seed.length;i++){ h=Math.imul(31,h)+seed.charCodeAt(i)|0; }
  return function(){ h=Math.imul(h^(h>>>15),h|1); h^=h+Math.imul(h^(h>>>7),h|61); return ((h^(h>>>14))>>>0)/4294967296; };
}
function drawFigure(x,groundY,fh,pose,rnd){
  // pose: 'stand' | 'point' | 'sit' | 'carry'
  const headR=fh*0.11, y=groundY-fh;
  let arms='';
  if(pose==='point'){
    arms=`<line x1="${x+fh*0.09}" y1="${y+fh*0.15}" x2="${x+fh*0.4}" y2="${y+fh*0.05}" stroke="#2b2b2b" stroke-width="${fh*0.07}" stroke-linecap="round"/>
          <line x1="${x-fh*0.09}" y1="${y+fh*0.15}" x2="${x-fh*0.2}" y2="${y+fh*0.35}" stroke="#2b2b2b" stroke-width="${fh*0.07}" stroke-linecap="round"/>`;
  } else if(pose==='carry'){
    arms=`<rect x="${x-fh*0.05}" y="${y+fh*0.02}" width="${fh*0.28}" height="${fh*0.22}" fill="#6b6357"/>`;
  } else {
    arms=`<line x1="${x-fh*0.09}" y1="${y+fh*0.15}" x2="${x-fh*0.17}" y2="${y+fh*0.4}" stroke="#2b2b2b" stroke-width="${fh*0.07}" stroke-linecap="round"/>
          <line x1="${x+fh*0.09}" y1="${y+fh*0.15}" x2="${x+fh*0.17}" y2="${y+fh*0.4}" stroke="#2b2b2b" stroke-width="${fh*0.07}" stroke-linecap="round"/>`;
  }
  if(pose==='sit'){
    return `<circle cx="${x}" cy="${y-fh*0.22}" r="${headR}" fill="#2b2b2b"/>
      <rect x="${x-fh*0.09}" y="${y-fh*0.1}" width="${fh*0.18}" height="${fh*0.35}" rx="${fh*0.07}" fill="#2b2b2b"/>
      <rect x="${x-fh*0.2}" y="${y+fh*0.22}" width="${fh*0.4}" height="${fh*0.16}" rx="${fh*0.06}" fill="#2b2b2b"/>`;
  }
  return `${arms}
    <circle cx="${x}" cy="${y-fh*0.22}" r="${headR}" fill="#2b2b2b"/>
    <rect x="${x-fh*0.09}" y="${y-fh*0.1}" width="${fh*0.18}" height="${fh*0.62}" rx="${fh*0.08}" fill="#2b2b2b"/>
    <rect x="${x-fh*0.16}" y="${y+fh*0.42}" width="${fh*0.13}" height="${fh*0.32}" fill="#2b2b2b"/>
    <rect x="${x+fh*0.03}" y="${y+fh*0.42}" width="${fh*0.13}" height="${fh*0.32}" fill="#2b2b2b"/>`;
}
// Six distinct scene templates so pictures actually look different and mean something,
// instead of the same 3 stick figures every time.
const TAT_TEMPLATES = [
  // 0: Village path with hills
  (rnd,w,h,groundY)=>{
    let s=`<circle cx="${w-80}" cy="70" r="34" fill="#f4d9a0"/>`;
    s+=`<polygon points="0,${groundY} 160,${groundY-90} 320,${groundY}" fill="#8b9c8a" opacity="0.55"/>`;
    s+=`<polygon points="180,${groundY} 340,${groundY-60} 500,${groundY}" fill="#7c9270" opacity="0.4"/>`;
    s+=`<rect x="70" y="${groundY-95}" width="9" height="95" fill="#6b6357"/><circle cx="74" cy="${groundY-108}" r="30" fill="#5f7a58" opacity="0.8"/>`;
    const poses=['stand','point'];
    const n=2+Math.floor(rnd()*2);
    for(let i=0;i<n;i++) s+=drawFigure(220+i*90+rnd()*30, groundY, 75+rnd()*20, poses[Math.floor(rnd()*poses.length)], rnd);
    return s;
  },
  // 1: Market street with stalls
  (rnd,w,h,groundY)=>{
    let s='';
    for(let i=0;i<3;i++){ const bx=40+i*190; s+=`<rect x="${bx}" y="${groundY-130}" width="130" height="130" fill="#9c9184" opacity="0.5"/><rect x="${bx+20}" y="${groundY-105}" width="24" height="30" fill="#e8e2d0"/><rect x="${bx+80}" y="${groundY-105}" width="24" height="30" fill="#e8e2d0"/>`; }
    s+=`<rect x="30" y="${groundY-4}" width="${w-60}" height="6" fill="#8a8478" opacity="0.5"/>`;
    s+=`<rect x="${w/2-30}" y="${groundY-40}" width="60" height="40" fill="#b3593f" opacity="0.6"/>`;
    const n=2+Math.floor(rnd()*2);
    for(let i=0;i<n;i++) s+=drawFigure(140+i*130+rnd()*40, groundY, 75+rnd()*15, rnd()<0.5?'stand':'carry', rnd);
    return s;
  },
  // 2: River / rescue scene
  (rnd,w,h,groundY)=>{
    let s=`<rect y="${groundY-30}" width="${w}" height="${h-groundY+30}" fill="#7fa3b0" opacity="0.55"/>`;
    s+=`<polygon points="${w*0.35},${groundY-10} ${w*0.65},${groundY-10} ${w*0.58},${groundY+30} ${w*0.42},${groundY+30}" fill="#6b5238"/>`;
    const n=2+Math.floor(rnd()*2);
    for(let i=0;i<n;i++) s+=drawFigure(w*0.42+i*35, groundY-8, 55, i===0?'point':'stand', rnd);
    return s;
  },
  // 3: Meeting / table scene (indoors)
  (rnd,w,h,groundY)=>{
    let s=`<rect x="20" y="30" width="${w-40}" height="${groundY-30}" fill="#efe9db" opacity="0.5"/>`;
    s+=`<rect x="${w/2-90}" y="${groundY-30}" width="180" height="16" fill="#8a7860" opacity="0.7"/>`;
    const n=3;
    const poses=['sit','sit','point'];
    for(let i=0;i<n;i++) s+=drawFigure(w/2-70+i*70, groundY, 78+rnd()*10, poses[i], rnd);
    return s;
  },
  // 4: Mountain trek
  (rnd,w,h,groundY)=>{
    let s=`<polygon points="0,${groundY} 130,${groundY-160} 260,${groundY}" fill="#8b8477" opacity="0.55"/>`;
    s+=`<polygon points="150,${groundY} 300,${groundY-190} 450,${groundY}" fill="#a29a8c" opacity="0.45"/>`;
    s+=`<polyline points="60,${groundY} 180,${groundY-30} 300,${groundY-10} 420,${groundY-40}" fill="none" stroke="#c9b98f" stroke-width="10" opacity="0.6"/>`;
    const n=2+Math.floor(rnd()*2);
    for(let i=0;i<n;i++) s+=drawFigure(200+i*70+rnd()*30, groundY-10-i*3, 70, 'carry', rnd);
    return s;
  },
  // 5: Evening campfire
  (rnd,w,h,groundY)=>{
    let s=`<circle cx="${100+rnd()*60}" cy="60" r="26" fill="#e9e4d6" opacity="0.8"/>`;
    for(let i=0;i<12;i++) s+=`<circle cx="${rnd()*w}" cy="${rnd()*(groundY-100)}" r="1.6" fill="#fff" opacity="0.7"/>`;
    s+=`<polygon points="${w/2-14},${groundY} ${w/2},${groundY-46} ${w/2+14},${groundY}" fill="#d97a3f"/>`;
    s+=`<polygon points="${w/2-8},${groundY} ${w/2},${groundY-26} ${w/2+8},${groundY}" fill="#f2b24a"/>`;
    const n=3;
    for(let i=0;i<n;i++){ const ang=i*2.2; s+=drawFigure(w/2+Math.cos(ang)*90, groundY, 72, 'sit', rnd); }
    return s;
  }
];
// Builds a themed scene (village, market, river-rescue, meeting, trek, or campfire) as an
// inline SVG data URI — renders instantly, works fully offline, and always differs by seed.
function generateTatScene(seed){
  const rnd = seededRand(seed);
  const w=640,h=420;
  const skies = [['#dfe7ee','#f4ede0'],['#e8e2d0','#f6f1e4'],['#dde3e6','#eef2ee'],['#e6ddd0','#f2ebda'],['#2c3242','#4a5268'],['#f0e3d0','#f9f2e6']];
  const templateIdx = Math.floor(rnd()*TAT_TEMPLATES.length);
  const isNight = templateIdx===5;
  const sky = isNight ? skies[4] : skies[Math.floor(rnd()*4)];
  const groundY = 270+Math.floor(rnd()*30);
  const groundColor = isNight ? '#4d4536' : '#c9c2ac';
  const scene = TAT_TEMPLATES[templateIdx](rnd,w,h,groundY);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${sky[0]}"/><stop offset="100%" stop-color="${sky[1]}"/>
    </linearGradient></defs>
    <rect width="${w}" height="${h}" fill="url(#sky)"/>
    <rect y="${groundY}" width="${w}" height="${h-groundY}" fill="${groundColor}"/>
    ${scene}
  </svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}

async function extractTextFromFile(file){
  const name = file.name.toLowerCase();
  if(name.endsWith('.txt')){
    return await file.text();
  }
  if(name.endsWith('.pdf')){
    if(!window.pdfjsLib) throw new Error('PDF reader failed to load — check your internet connection and try again.');
    const buf = await file.arrayBuffer();
    const doc = await pdfjsLib.getDocument({data:buf}).promise;
    let out='';
    for(let p=1;p<=doc.numPages;p++){
      const page = await doc.getPage(p);
      const content = await page.getTextContent();
      out += content.items.map(it=>it.str).join(' ') + '\n';
    }
    return out.trim();
  }
  if(name.endsWith('.docx')){
    if(!window.mammoth) throw new Error('Word reader failed to load — check your internet connection and try again.');
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({arrayBuffer:buf});
    return result.value.trim();
  }
  if(name.endsWith('.doc')){
    throw new Error('Old .doc format isn\'t supported — open it in Word and "Save As" .docx, or copy-paste the text instead.');
  }
  throw new Error('Unsupported file type — use .txt, .pdf, or .docx.');
}

async function generateMcqsFromNotes(notesText,count){
  const resp = await fetch(AI_BACKEND_URL,{
    method:'POST',
    body: JSON.stringify({notes:notesText, count:count})
  });
  if(!resp.ok){
    throw new Error('Server error ('+resp.status+'). Try again in a bit.');
  }
  const data = await resp.json();
  if(data.error){
    const msg = typeof data.error === 'string' ? data.error : (data.error.message || JSON.stringify(data.error));
    throw new Error('Generator error: '+msg);
  }
  const text = data?.choices?.[0]?.message?.content;
  if(!text) throw new Error('No response text came back — try again.');
  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(e){ throw new Error('Could not parse the AI response as JSON — try again.'); }
  const arr = Array.isArray(parsed) ? parsed : parsed.questions;
  if(!Array.isArray(arr) || arr.length===0) throw new Error('AI did not return any questions — try shorter/clearer notes.');
  const clean = arr.filter(q=>q && typeof q.q==='string' && Array.isArray(q.opts) && q.opts.length===4 && Number.isInteger(q.ans) && q.ans>=0 && q.ans<=3);
  if(clean.length===0) throw new Error('AI response was malformed — try again.');
  return clean;
}

/* =========================================================================
   EVENT WIRING
   ========================================================================= */
function wireViewEvents(){
  document.querySelectorAll('.card[data-nav]').forEach(c=>{
    c.addEventListener('click',()=>{ if(c.dataset.nav==='testsetup') STATE.test=null; setView(c.dataset.nav); });
  });

  if(STATE.view==='study'){
    const input=document.getElementById('studySearchInput');
    if(input) input.addEventListener('input', e=>{STATE.studySearch=e.target.value; render(); input.focus(); input.selectionStart=input.selectionEnd=input.value.length;});
    document.querySelectorAll('[data-filter]').forEach(b=>{
      b.addEventListener('click',()=>{STATE.studyFilter=b.dataset.filter; render();});
    });
    const toggleBtn=document.getElementById('toggleAddMcqBtn');
    if(toggleBtn) toggleBtn.addEventListener('click',()=>{ STATE.showAddMcq=!STATE.showAddMcq; render(); });
    const toggleAiBtn=document.getElementById('toggleAiGenBtn');
    if(toggleAiBtn) toggleAiBtn.addEventListener('click',()=>{ STATE.showAiGen=!STATE.showAiGen; STATE.aiGenError=null; render(); });
    const fileInput=document.getElementById('notesFileInput');
    if(fileInput) fileInput.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      STATE.fileParsing=true; STATE.fileParseError=null; render();
      try{
        const text = await extractTextFromFile(file);
        if(!text || text.trim().length<10){
          STATE.fileParseError='Couldn\'t find readable text in that file — try a different file or paste the text manually.';
        }else{
          STATE.aiNotesDraft = text;
        }
      }catch(err){
        STATE.fileParseError = err.message || 'Could not read that file.';
      }
      STATE.fileParsing=false;
      render();
    });
    const aiGenBtn=document.getElementById('aiGenerateBtn');
    if(aiGenBtn) aiGenBtn.addEventListener('click', async ()=>{
      const notes=document.getElementById('aiNotesText').value.trim();
      const count=parseInt(document.getElementById('aiMcqCount').value,10);
      if(!notes || notes.length<20){ STATE.aiGenError='Please paste some notes first (at least a few sentences).'; render(); return; }
      STATE.aiGenLoading=true; STATE.aiGenError=null; STATE.aiGenerated=[]; render();
      try{
        const qs = await generateMcqsFromNotes(notes,count);
        STATE.aiGenerated = qs.map(q=>({...q, selected:true}));
      }catch(err){
        STATE.aiGenError = err.message || 'Something went wrong. Please try again.';
      }
      STATE.aiGenLoading=false;
      render();
    });
    document.querySelectorAll('[data-aicheck]').forEach(cb=>{
      cb.addEventListener('change', e=>{
        const idx=parseInt(cb.dataset.aicheck,10);
        STATE.aiGenerated[idx].selected = e.target.checked;
      });
    });
    const aiSaveBtn=document.getElementById('aiSaveSelectedBtn');
    if(aiSaveBtn) aiSaveBtn.addEventListener('click',()=>{
      const chosen = STATE.aiGenerated.filter(q=>q.selected);
      if(chosen.length===0){ return; }
      const custom=loadCustomMcqs();
      chosen.forEach(q=> custom.push({q:q.q, opts:q.opts, ans:q.ans}));
      saveCustomMcqs(custom);
      refreshAllQ();
      STATE.aiGenerated=[];
      STATE.showAiGen=false;
      STATE.studyFilter='My Notes';
      render();
    });
    const saveBtn=document.getElementById('mcqSaveBtn');
    if(saveBtn) saveBtn.addEventListener('click',()=>{
      const qText=document.getElementById('mcqQ').value.trim();
      const optA=document.getElementById('mcqOptA').value.trim();
      const optB=document.getElementById('mcqOptB').value.trim();
      const optC=document.getElementById('mcqOptC').value.trim();
      const optD=document.getElementById('mcqOptD').value.trim();
      const ans=parseInt(document.getElementById('mcqCorrect').value,10);
      if(!qText || !optA || !optB || !optC || !optD){
        document.getElementById('mcqFormError').style.display='block';
        return;
      }
      const custom=loadCustomMcqs();
      custom.push({q:qText, opts:[optA,optB,optC,optD], ans});
      saveCustomMcqs(custom);
      refreshAllQ();
      STATE.showAddMcq=false;
      STATE.studyFilter='My Notes';
      render();
    });
    document.querySelectorAll('[data-delcustom]').forEach(b=>{
      b.addEventListener('click',()=>{
        const id=b.dataset.delcustom; // 'custom'+index
        const idx=parseInt(id.replace('custom',''),10);
        const custom=loadCustomMcqs();
        custom.splice(idx,1);
        saveCustomMcqs(custom);
        refreshAllQ();
        render();
      });
    });
  }

  if(STATE.view==='testsetup'){
    const btn=document.getElementById('startTestBtn');
    if(btn) btn.addEventListener('click',()=>{
      const total=parseInt(document.getElementById('cfgTotal').value,10);
      const minutes=parseInt(document.getElementById('cfgTime').value,10);
      STATE.test = buildTest(total,minutes);
      setView('testrun');
      clearInterval(TEST_TIMER_HANDLE);
      TEST_TIMER_HANDLE=setInterval(tickTimer,1000);
    });
  }

  if(STATE.view==='testrun'){
    const t=STATE.test;
    document.querySelectorAll('[data-opt]').forEach(b=>{
      b.addEventListener('click',()=>{
        t.answers[t.current]=parseInt(b.dataset.opt,10);
        render();
      });
    });
    document.querySelectorAll('[data-jump]').forEach(s=>{
      s.addEventListener('click',()=>{ t.current=parseInt(s.dataset.jump,10); render(); });
    });
    const prev=document.getElementById('prevQ');
    if(prev) prev.addEventListener('click',()=>{ t.current=Math.max(0,t.current-1); render(); });
    const next=document.getElementById('nextQ');
    if(next) next.addEventListener('click',()=>{ t.current=Math.min(t.questions.length-1,t.current+1); render(); });
    const submit=document.getElementById('submitTest');
    if(submit) submit.addEventListener('click', finishTest);
  }

  if(STATE.view==='testresult'){
    const retake=document.getElementById('retakeBtn');
    if(retake) retake.addEventListener('click',()=>{ setView('testsetup'); });
  }

  if(STATE.view==='issb'){
    document.querySelectorAll('[data-issbtab]').forEach(b=>{
      b.addEventListener('click',()=>{ ISSB_TAB=b.dataset.issbtab; render(); });
    });
    if(ISSB_TAB==='srt'){
      const startBtn=document.getElementById('srtStartBtn');
      if(startBtn) startBtn.addEventListener('click',()=>{
        clearInterval(STATE.srtTimer);
        STATE.srtSeconds=30;
        STATE.srtRunning=true;
        updateSrtTimerDisplay();
        STATE.srtTimer=setInterval(()=>{
          STATE.srtSeconds--;
          if(STATE.srtSeconds<=0){ clearInterval(STATE.srtTimer); STATE.srtSeconds=0; STATE.srtRunning=false; }
          updateSrtTimerDisplay();
        },1000);
      });
      const nextBtn=document.getElementById('srtNextBtn');
      if(nextBtn) nextBtn.addEventListener('click',()=>{
        clearInterval(STATE.srtTimer);
        STATE.srtSeconds=30; STATE.srtRunning=false;
        STATE.srtIndex++;
        render();
      });
    }
    if(ISSB_TAB==='wat'){
      const startBtn=document.getElementById('watStartBtn');
      if(startBtn) startBtn.addEventListener('click',()=>{
        clearInterval(STATE.watTimer);
        STATE.watSeconds=15;
        STATE.watRunning=true;
        updateWatTimerDisplay();
        STATE.watTimer=setInterval(()=>{
          STATE.watSeconds--;
          if(STATE.watSeconds<=0){ clearInterval(STATE.watTimer); STATE.watSeconds=0; STATE.watRunning=false; }
          updateWatTimerDisplay();
        },1000);
      });
      const nextBtn=document.getElementById('watNextBtn');
      if(nextBtn) nextBtn.addEventListener('click',()=>{
        clearInterval(STATE.watTimer);
        STATE.watSeconds=15; STATE.watRunning=false;
        STATE.watIndex++;
        render();
      });
    }
    if(ISSB_TAB==='tat'){
      const startBtn=document.getElementById('tatStartBtn');
      if(startBtn) startBtn.addEventListener('click',()=>{
        clearInterval(STATE.tatTimer);
        STATE.tatSeconds=30;
        STATE.tatRunning=true;
        updateTatTimerDisplay();
        STATE.tatTimer=setInterval(()=>{
          STATE.tatSeconds--;
          if(STATE.tatSeconds<=0){ clearInterval(STATE.tatTimer); STATE.tatSeconds=0; STATE.tatRunning=false; }
          updateTatTimerDisplay();
        },1000);
      });
      const nextBtn=document.getElementById('tatNextBtn');
      if(nextBtn) nextBtn.addEventListener('click',()=>{
        clearInterval(STATE.tatTimer);
        STATE.tatSeconds=30; STATE.tatRunning=false;
        STATE.tatIndex++;
        render();
      });
    }
  }
}

function updateSrtTimerDisplay(){
  const d=document.getElementById('srtTimerDisplay');
  if(d){ d.textContent=STATE.srtSeconds+'s'; d.classList.toggle('low', STATE.srtSeconds<=10); }
}
function updateWatTimerDisplay(){
  const d=document.getElementById('watTimerDisplay');
  if(d){ d.textContent=STATE.watSeconds+'s'; d.classList.toggle('low', STATE.watSeconds<=5); }
}
function updateTatTimerDisplay(){
  const d=document.getElementById('tatTimerDisplay');
  if(d){ d.textContent=STATE.tatSeconds+'s'; d.classList.toggle('low', STATE.tatSeconds<=10); }
}

render();
